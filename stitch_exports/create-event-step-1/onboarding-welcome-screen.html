<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2e22",
                        "text-main": "#0d1b13",
                        "background-dark": "#102218",
                        "text-muted": "#4c9a6c",
                        "primary-dark": "#0fb654",
                        "overlay-gradient": "linear-gradient(to top, rgba(0,0,0,0.8), transparent)",
                        "background-light": "#f8fcfa",
                        "glass-white": "rgba(255, 255, 255, 0.2)"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "element-gap": "1rem",
                        "card-padding": "0.75rem",
                        "section-gap": "2rem",
                        "inline-gap": "0.75rem",
                        "container-padding": "1.5rem"
                    },
                    "fontFamily": {
                        "label-bold": ["Plus Jakarta Sans"],
                        "display-xl": ["Plus Jakarta Sans"],
                        "body-base": ["Plus Jakarta Sans"],
                        "navigation": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-bold": ["0.75rem", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "700"}],
                        "display-xl": ["1.5rem", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-base": ["0.875rem", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "500"}],
                        "navigation": ["10px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-md": ["1.125rem", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hero-gradient {
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(248, 252, 250, 0.8) 60%, #f8fcfa 100%);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(15, 182, 84, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light font-body-base text-text-main overflow-hidden">
<!-- Onboarding Container -->
<main class="relative h-screen w-full flex flex-col justify-end">
<!-- Hero Image Section -->
<div class="absolute inset-0 z-0">
<img alt="People practicing yoga in a lush park" class="h-full w-full object-cover" data-alt="A wide-angle organic photograph of a diverse group of young adults practicing yoga together in a sun-drenched, vibrant green city park. The lighting is warm and golden-hour inspired, creating soft shadows and a high-fidelity feel. The color palette is dominated by deep forest greens and bright neon-organic lime accents from the grass and athletic wear. The atmosphere is energetic, optimistic, and deeply community-driven, perfectly reflecting a modern urban lifestyle accessory aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxX4ULmgh3vTL94GeYyT4jMdQllHAOs2zCAM2jh1eaHJq2905HPpOuI1R8gq0PhPVCOjrk3mGUP1t703m3Wcp-zDTdS28c0xqPKuyVUrQ5LintMSOhgB08OAiU0fg_AW6y7UCpr2nIkdKqRBeGqbsn_1ui8lZtbXOWot0-iqNggPnWTB-zUJMMShsridiHQH8cU0kEFQ34YP3QzTfw0NK3tPx3Aw0_SCF9_ywG6AN__ZInNEfQSdglp4HreWhQ54bSF7B2wJMqPqxH"/>
<!-- Fade Overlay to transition to content -->
<div class="absolute inset-0 hero-gradient"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 px-container-padding pb-12 flex flex-col items-center text-center">
<!-- Brand Logo Mark -->
<div class="mb-section-gap animate-fade-in">
<div class="w-16 h-16 bg-surface-light rounded-xl flex items-center justify-center shadow-card mb-4 mx-auto neon-glow">
<span class="material-symbols-outlined text-primary-dark text-4xl" data-icon="hub">hub</span>
</div>
<h1 class="font-display-xl text-display-xl text-text-main">
                    CommunityConnect
                </h1>
</div>
<!-- Value Proposition -->
<div class="max-w-sm space-y-element-gap mb-10">
<h2 class="font-headline-md text-headline-md text-text-main px-4">
                    Connect with Your Local Community
                </h2>
<p class="font-body-base text-body-base text-text-muted px-2">
                    Discover local events, join passionate groups, and build meaningful connections in your neighborhood.
                </p>
</div>
<!-- Actions -->
<div class="w-full max-w-sm space-y-4">
<!-- Primary Button -->
<button class="w-full bg-primary-dark text-surface-light font-label-bold py-4 rounded-full shadow-lg active:scale-95 transition-all duration-200 neon-glow flex items-center justify-center gap-2">
                    Get Started
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Action -->
<div class="pt-2">
<p class="font-body-base text-text-muted">
                        Already have an account? 
                        <button class="text-primary-dark font-label-bold ml-1 active:opacity-70 transition-opacity">
                            Log In
                        </button>
</p>
</div>
</div>
<!-- Decorative Element (Bottom Indicator) -->
<div class="mt-8 flex gap-2">
<div class="h-1.5 w-8 bg-primary-dark rounded-full"></div>
<div class="h-1.5 w-2 bg-text-muted/20 rounded-full"></div>
<div class="h-1.5 w-2 bg-text-muted/20 rounded-full"></div>
</div>
</div>
<!-- Backdrop Blur Accents -->
<div class="absolute top-10 left-10 w-32 h-32 bg-primary-dark/10 rounded-full blur-3xl"></div>
<div class="absolute top-1/4 right-0 w-48 h-48 bg-primary-dark/5 rounded-full blur-3xl"></div>
</main>
</body></html>
